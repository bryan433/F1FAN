name: F1Fan CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & QA Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests & Unit Coverage
        run: npm run test:unit:coverage

      - name: Run Full Test Suite in CI Mode
        run: npm run test:ci

      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1fan-test-coverage
          path: |
            coverage/
            coverage-unit/
          retention-days: 14
